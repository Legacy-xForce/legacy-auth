<!doctype html>
<html lang="en" data-theme="oled">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="darkreader-lock" />
    <script>
      // Apply the saved theme before the first paint to avoid a flash of the default palette.
      // This table mirrors THEMES in src/theme/themes.ts; test/frontend-helpers.test.ts keeps them in sync.
      (() => {
        try {
          const themes = {
            oled: ["#000000", "dark"],
            "catppuccin-mocha": ["#11111b", "dark"],
            "catppuccin-macchiato": ["#181926", "dark"],
            "catppuccin-frappe": ["#232634", "dark"],
            "catppuccin-latte": ["#e6e9ef", "light"],
            adaptive: ["#000000", "dark"],
          };
          const stored = localStorage.getItem("pref_theme");
          let theme = stored && Object.prototype.hasOwnProperty.call(themes, stored) ? stored : "oled";
          const prefersLight = matchMedia("(prefers-color-scheme: light)").matches;
          if (theme === "adaptive") theme = prefersLight ? "catppuccin-latte" : "oled";
          const [canvas, mode] = themes[theme];
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = mode;
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", mode);
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", canvas);
        } catch {
          // Storage can be unavailable; fall through to the OLED defaults.
        }
      })();
    </script>
    <title>Legacy Auth</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
